<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

    <meta charset="UTF-8" />

    <style type="text/css">

        border-collapse: separate;
        table-layout: fixed;
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;

      table td {
        border-collapse: collapse;

      h2,

      html {

      }
      body {
        min-width: 100%;
        margin: 0;
        padding: 0;
      }
      img {
        margin: 0;
        padding: 0;
        -ms-interpolation-mode: bicubic;
      }
      h1,
      h2,
      h3,
      p,
      a {
        overflow-wrap: normal;
        white-space: normal;
        word-break: break-word;
      }
      a {
        text-decoration: none;
      }
      h1,
      h2,
      h3,
      p {

        width: 100% !important;
        max-width: 100% !important;
        display: inline-block !important;
        border: 0;
        padding: 0;
        margin: 0;

        font-size: inherit !important;
        font-family: inherit !important;
        font-weight: inherit !important;
        line-height: inherit !important;
      }

        color: inherit;
        text-decoration: none;
        font-size: inherit;
        font-family: inherit;
        font-weight: inherit;
        line-height: inherit;
      }
      a[href^="mailto"],
      a[href^="tel"],
      a[href^="sms"] {
        color: inherit;
        text-decoration: none;
      }

    <link

  <body

    <table

      cellspacing="0"
      border="0"

                  border: 1px solid #3f3f46;
                  border-radius: 18px;

                  width="100%"
                  cellpadding="0"
                  cellspacing="0"

                          font-family: &quot;Syne&quot;, Arial, sans-serif;

                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        style="margin: 0 auto"
                      >

                          <td

                              height: 64px;
                              background-color: rgba(124, 58, 237, 0.15);

                              border-radius: 50%;
                              text-align: center;
                              vertical-align: middle;
                            "

                    </td>

                          font-family: &quot;Syne&quot;, Arial, sans-serif;
                          font-size: 22px;

                          color: #fafafa;
                          text-align: center;
                          line-height: 1.2;

                          margin: 0;
                          font-family: &quot;DM Sans&quot;, Arial, sans-serif;

                          line-height: 1.65;

                        cellpadding="0"
                        cellspacing="0"

                        <tr>
                          <td

                              border-radius: 10px;
                              text-align: center;
                            "

                            <a

                              target="_blank"

                                font-family:

                                font-size: 14px;
                                font-weight: 500;
                                color: #ffffff;
                                text-decoration: none;

                              line-height: 0;

                      </table>
                    </td>

                    <td align="center">

                          color: #71717a;
                          text-align: center;
                          line-height: 1.6;

                    font-family: &quot;DM Sans&quot;, Arial, sans-serif;

                    color: #3f3f46;
                    text-align: center;
