<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Sagar Auth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #09090b;
        --surface: #18181b;
        --border: #3f3f46;
        --text: #fafafa;
        --text-2: #a1a1aa;
        --text-3: #71717a;
        --accent: #7c3aed;
        --accent-h: #6d28d9;
        --accent-g: rgba(124, 58, 237, 0.35);
        --fd: "Syne", sans-serif;
        --fb: "DM Sans", sans-serif;
        --fm: "DM Mono", monospace;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--fb);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        animation: fadeIn 0.6s ease both;
        overflow: hidden;
      }
      body.loaded {
        overflow: auto;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(
            ellipse 60% 50% at 20% 20%,
            rgba(124, 58, 237, 0.1) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse 50% 40% at 80% 80%,
            rgba(109, 40, 217, 0.07) 0%,
            transparent 55%
          );
        pointer-events: none;
      }

      .wrap {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 480px;
        width: 100%;
      }

      /* big 404 */
      .four-o-four {
        font-family: var(--fd);
        font-size: clamp(96px, 20vw, 140px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -4px;
        margin-top: 16px;
        background: linear-gradient(135deg, #fff 0%, var(--text-3) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 8px;
        user-select: none;
      }

      .error-code {
        font-family: var(--fm);
        font-size: 11.5px;
        color: var(--accent);
        background: rgba(124, 58, 237, 0.1);
        border: 1px solid rgba(124, 58, 237, 0.25);
        border-radius: 6px;
        padding: 4px 12px;
        letter-spacing: 0.06em;
        margin-bottom: 28px;
      }

      h1 {
        font-family: var(--fd);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.4px;
        color: var(--text);
        margin-bottom: 12px;
      }

      p {
        font-size: 14px;
        color: var(--text-2);
        line-height: 1.7;
        font-weight: 300;
        margin-bottom: 36px;
      }

      /* divider */
      .divider {
        width: 40px;
        height: 1px;
        background: var(--border);
        margin: 0 auto 36px;
      }

      /* actions */
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 22px;
        border-radius: 9px;
        font-family: var(--fb);
        font-size: 13.5px;
        font-weight: 500;
        cursor: pointer;
        border: none;
        text-decoration: none;
        transition: all 0.2s;
        line-height: 1;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--accent-h);
        box-shadow: 0 0 20px var(--accent-g);
      }
      .btn-ghost {
        background: transparent;
        color: var(--text-2);
        border: 1px solid var(--border);
      }
      .btn-ghost:hover {
        background: var(--surface);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="four-o-four">404</div>
      <div class="error-code">PAGE_NOT_FOUND</div>

      <h1>Nothing here</h1>
      <p>
        The page you're looking for doesn't exist or has been moved. Check the
        URL or head back home.
      </p>

      <div class="divider"></div>

      <div class="actions">
        <a href="/" class="btn btn-primary">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
          Go home
        </a>
        <a href="javascript:history.back()" class="btn btn-ghost">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M19 12H5M12 5l-7 7 7 7" />
          </svg>
          Go back
        </a>
      </div>
    </div>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          document.body.classList.add('loaded');
        }, 600);
      });
    </script>
  </body>
</html>
